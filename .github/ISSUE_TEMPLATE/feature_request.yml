name: Feature request
description: Propose a focused improvement to repository analysis or evidence review.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What repository-reading or reproduction task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example
      description: Link to a public repository or file pattern that shows the need.
  - type: textarea
    id: validation
    attributes:
      label: How should it be checked?
      description: Describe a test or observable result that would show the feature works.
